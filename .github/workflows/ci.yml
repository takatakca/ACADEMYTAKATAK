name: Academy CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: academy_ci
          POSTGRES_PASSWORD: academy_ci_local_only
          POSTGRES_DB: academy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U academy_ci -d academy_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    env:
      ACADEMY_TEST_DATABASE_URL: postgresql://academy_ci:academy_ci_local_only@127.0.0.1:5432/academy_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
