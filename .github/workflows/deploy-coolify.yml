name: Academy production deploy (Coolify)
on:
  workflow_run:
    workflows: ["Academy CI"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: academy-coolify-production
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && vars.ACADEMY_AUTODEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      ACADEMY_HEALTHCHECK_URL: ${{ vars.ACADEMY_HEALTHCHECK_URL }}
      VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify deploy is configured and CI SHA is still latest main
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${COOLIFY_WEBHOOK}" || -z "${COOLIFY_TOKEN}" || -z "${ACADEMY_HEALTHCHECK_URL}" ]]; then
            echo "::error::Missing Coolify webhook/token or public Academy health URL."
            exit 1
          fi
          if [[ "${COOLIFY_WEBHOOK}" != https://*/api/v1/deploy\?* ]]; then
            echo "::error::Expected an HTTPS Coolify resource deploy webhook."
            exit 1
          fi
          if [[ "${ACADEMY_HEALTHCHECK_URL}" != https://*/api/health ]]; then
            echo "::error::ACADEMY_HEALTHCHECK_URL must be a trusted HTTPS Academy /api/health URL."
            exit 1
          fi
          latest="$(curl -fsS --max-time 15 -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" | jq -r '.object.sha // empty')"
          if [[ "${latest}" != "${VERIFIED_SHA}" ]]; then
            echo "A newer main revision exists: skipping superseded CI build."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Trigger verified Academy source deployment
        if: steps.preflight.outputs.ready == 'true'
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS --max-time 30 -X POST -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Accept: application/json" "${COOLIFY_WEBHOOK}")"
          deployment_uuid="$(printf '%s' "${response}" | jq -r '.deployments[0].deployment_uuid // empty')"
          if [[ ! "${deployment_uuid}" =~ ^[a-zA-Z0-9_-]+$ ]]; then
            echo "::error::Coolify did not return a deployment UUID."
            exit 1
          fi
          echo "Deployment queued (not yet verified): ${deployment_uuid}"
          echo "uuid=${deployment_uuid}" >> "$GITHUB_OUTPUT"
      - name: Verify Coolify deployed the exact commit
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base="${COOLIFY_WEBHOOK%%/deploy*}"
          uuid="${{ steps.deploy.outputs.uuid }}"
          for attempt in {1..65}; do
            response="$(curl -fsS --max-time 20 -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
              "${base}/deployments/${uuid}")"
            status="$(printf '%s' "${response}" | jq -r '.status // "unknown"')"
            commit="$(printf '%s' "${response}" | jq -r '.commit // empty')"
            if [[ "${status}" == "finished" ]]; then
              if [[ "${commit}" != "${VERIFIED_SHA}" ]]; then
                echo "::error::Coolify completed a different/unverified commit: ${commit}"
                exit 1
              fi
              echo "Coolify reports finished with the expected commit ${VERIFIED_SHA}"
              body="$(curl -fsS --retry 3 --retry-delay 3 --max-time 20 "${ACADEMY_HEALTHCHECK_URL}")"
              if ! printf '%s' "${body}" | jq -e '.service == "takatak-academy" and .status == "running"' >/dev/null; then
                echo "::error::Academy health response is unexpected."
                exit 1
              fi
              echo "Deployment verified: exact commit + public Academy health response."
              exit 0
            fi
            if [[ "${status}" == "failed" || "${status}" == "cancelled" || "${status}" == "cancelled-by-user" ]]; then
              echo "::error::Coolify deployment failed, status ${status}"
              exit 1
            fi
            sleep 10
          done
          echo "::error::Coolify deployment verification timed out."
          exit 1
